server:
  port: 8084

spring:
  config:
    activate:
      on-profile: ide

  datasource:
    url: jdbc:postgresql://localhost:5432/it_mentor_community_platform?currentSchema=project_service
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092

kafka:
  topic:
    projects-project-created: projects.project.created
    notifications-students-review-submitted: notifications.students.review.submitted
    reviews-review-created: reviews.review.created